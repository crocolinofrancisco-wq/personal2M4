name: Stoneplace overnight run

on:
  workflow_dispatch:
    inputs:
      total_years:
        description: "Años del mundo a simular"
        default: "1200"
      phase1_years:
        description: "Años sólo con plantas/hongos antes de soltar fauna"
        default: "150"
      world_width:
        description: "Ancho del mundo sintético (celdas)"
        default: "400"
      world_height:
        description: "Alto del mundo sintético (celdas)"
        default: "200"
      speciation_every:
        description: "Chequeo de especiación cada N años"
        default: "25"
      mutation_rate:
        description: "Tasa de mutación por locus (default v1.5.1 = 1.2e-3)"
        default: "1.2e-3"
      seeds:
        description: "Lista JSON de seeds a correr en paralelo (matriz)"
        default: "[1, 2]"
      snapshot_every:
        description: "PNG del mundo cada N años (0 = deshabilitado)"
        default: "200"
      perturbations_file:
        description: "JSON con perturbaciones (ruta relativa al repo, vacío = ninguna)"
        default: "examples/glaciation_year_500.json"

jobs:
  simulate:
    runs-on: ubuntu-latest
    # ~5h50m: GitHub mata a las 6h. Dejamos margen para que el upload
    # de artifacts termine bien.
    timeout-minutes: 350
    strategy:
      # No cancelar el otro seed si uno falla.
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(github.event.inputs.seeds) }}
    name: "seed-${{ matrix.seed }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pytest (rápido, aborta el run si falla)
        run: pytest tests/ -x

      - name: Run simulation
        run: |
          mkdir -p outputs_seed${{ matrix.seed }}
          PERTURB_FLAG=""
          if [ -n "${{ github.event.inputs.perturbations_file }}" ]; then
            PERTURB_FLAG="--perturbations-file ${{ github.event.inputs.perturbations_file }}"
            echo "Perturbations file: ${{ github.event.inputs.perturbations_file }}"
            cat "${{ github.event.inputs.perturbations_file }}"
          fi
          python -u -m stoneplace.cli.run \
            --synthetic-size ${{ github.event.inputs.world_width }} ${{ github.event.inputs.world_height }} \
            --seed ${{ matrix.seed }} \
            --phase1-years ${{ github.event.inputs.phase1_years }} \
            --total-years ${{ github.event.inputs.total_years }} \
            --telemetry-every 10 \
            --speciation-every ${{ github.event.inputs.speciation_every }} \
            --founder-plant 500 \
            --founder-fungi 400 \
            --founder-animal 800 \
            --mutation-rate ${{ github.event.inputs.mutation_rate }} \
            --snapshot-every ${{ github.event.inputs.snapshot_every }} \
            --dump-every-snapshots 10 \
            $PERTURB_FLAG \
            --out outputs_seed${{ matrix.seed }} \
            2>&1 | tee outputs_seed${{ matrix.seed }}/run.log

      - name: Resumen rápido en el job log
        if: always()
        run: |
          echo "=== phylo.nwk ==="
          cat outputs_seed${{ matrix.seed }}/phylo.nwk 2>/dev/null || echo "(no phylo)"
          echo
          echo "=== eventos de narrativa por tipo ==="
          python -c "
          import json, collections, pathlib
          p = pathlib.Path('outputs_seed${{ matrix.seed }}/narrative.jsonl')
          if p.exists():
              kinds = collections.Counter(json.loads(l)['kind']
                                          for l in p.read_text().splitlines())
              print(dict(kinds))
          " || true
          echo
          echo "=== últimas líneas del log ==="
          tail -30 outputs_seed${{ matrix.seed }}/run.log || true

      - name: Upload artifacts
        # Corre siempre — incluso si el timeout mata la simulación, sube
        # lo que haya en outputs (los checkpoints periódicos).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoneplace-seed-${{ matrix.seed }}
          path: outputs_seed${{ matrix.seed }}/
          retention-days: 14
