name: Stoneplace overnight run

on:
  workflow_dispatch:
    inputs:
      total_years:
        description: "Años del mundo a simular"
        default: "1000"
      phase1_years:
        description: "Años sólo con plantas/hongos antes de soltar fauna"
        default: "100"
      world_width:
        description: "Ancho del mundo sintético (ignorado si world_bin está seteado)"
        default: "400"
      world_height:
        description: "Alto del mundo sintético (ignorado si world_bin está seteado)"
        default: "200"
      world_bin:
        description: "Ruta (relativa al repo) a un .bin real de SeedWorld. Vacío = mundo sintético."
        default: ""
      world_json:
        description: "Ruta (relativa al repo) al .json que acompaña al world_bin."
        default: ""
      founder_plant:
        description: "Fundadores por especie de planta"
        default: "500"
      founder_fungi:
        description: "Fundadores por especie de hongo"
        default: "400"
      founder_animal:
        description: "Fundadores por especie animal"
        default: "800"
      warn_pop_per_species:
        description: "Umbral de aviso por especie (v1.5: sin cap duro, sólo warning)"
        default: "500000"
      perturbations_file:
        description: "Ruta (relativa al repo) a un JSON de perturbaciones. Vacío = ninguna."
        default: ""

jobs:
  simulate:
    runs-on: ubuntu-latest
    # Cap de seguridad del job — no es la duración real (la controla
    # total_years). GitHub mata cualquier job a las 6h como máximo.
    timeout-minutes: 240
    strategy:
      # No cancelar el otro seed si uno falla.
      fail-fast: false
      matrix:
        seed: [1, 2]
    name: "seed-${{ matrix.seed }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run simulation
        run: |
          mkdir -p outputs_seed${{ matrix.seed }}
          ARGS=(
            --seed ${{ matrix.seed }}
            --phase1-years ${{ github.event.inputs.phase1_years }}
            --total-years ${{ github.event.inputs.total_years }}
            --telemetry-every 10
            --speciation-every 50
            --founder-plant ${{ github.event.inputs.founder_plant }}
            --founder-fungi ${{ github.event.inputs.founder_fungi }}
            --founder-animal ${{ github.event.inputs.founder_animal }}
            --warn-pop-per-species ${{ github.event.inputs.warn_pop_per_species }}
            --dump-every-snapshots 10
            --out outputs_seed${{ matrix.seed }}
          )
          if [ -n "${{ github.event.inputs.world_bin }}" ]; then
            ARGS+=(--world-bin "${{ github.event.inputs.world_bin }}" \
                   --world-json "${{ github.event.inputs.world_json }}")
          else
            ARGS+=(--synthetic-size ${{ github.event.inputs.world_width }} ${{ github.event.inputs.world_height }})
          fi
          if [ -n "${{ github.event.inputs.perturbations_file }}" ]; then
            ARGS+=(--perturbations-file "${{ github.event.inputs.perturbations_file }}")
          fi
          echo "python -m stoneplace.cli.run ${ARGS[@]}"
          python -u -m stoneplace.cli.run "${ARGS[@]}" \
            2>&1 | tee outputs_seed${{ matrix.seed }}/run.log

      - name: Upload artifacts
        # Corre siempre — incluso si el timeout mata la simulación, sube
        # lo que haya en outputs (los checkpoints periódicos).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoneplace-seed-${{ matrix.seed }}
          path: outputs_seed${{ matrix.seed }}/
          retention-days: 14
